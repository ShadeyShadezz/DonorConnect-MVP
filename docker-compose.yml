version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: donorconnect
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d donorconnect"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db-data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/donorconnect
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: donorconnect-local-dev-secret-change-in-production

volumes:
  db-data:
